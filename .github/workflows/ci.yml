name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: python manage.py makemigrations --check
      - run: pytest
      - run: ruff check .

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: content_tracker
          POSTGRES_USER: content_tracker
          POSTGRES_PASSWORD: content_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: content_tracker
      DB_USER: content_tracker
      DB_PASSWORD: content_tracker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: python manage.py makemigrations --check
      - run: python manage.py migrate
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: npx playwright install chromium --with-deps
      - run: pip install -e ../backend
      - name: E2E smoke (backend + vite + playwright)
        run: |
          set -euo pipefail
          python ../backend/manage.py migrate
          python ../backend/manage.py runserver 127.0.0.1:8001 &
          BACKEND_PID=$!
          VITE_DEV_PROXY_TARGET=http://127.0.0.1:8001 npm run dev -- --port 5173 &
          VITE_PID=$!
          cleanup() {
            kill "$BACKEND_PID" "$VITE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          npx wait-on http://127.0.0.1:8001/api/health http://localhost:5173/ --timeout 60000
          npm run test:e2e
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://127.0.0.1:8001/api

  containers:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose -f compose.yaml -f .devcontainer/compose.yaml config
      - run: docker build --target prod ./backend
      - run: docker build --target prod ./frontend
      - run: docker compose up -d --build
      - run: docker compose run --rm backend python manage.py migrate
      - run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/api/health
          curl -sf "http://localhost:8000/api/items?limit=1"
          curl -sf http://localhost:8080/api/health
      - run: docker compose down
        if: always()
