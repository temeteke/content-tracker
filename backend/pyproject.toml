[project]
name = "content-tracker-backend"
version = "0.1.0"
description = "Backend API for content-tracker"
requires-python = ">=3.12"
dependencies = [
  "Django~=6.1",
  "django-ninja~=1.6.2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4.10,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["content/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
